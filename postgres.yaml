---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: znuny-postgres-data
  namespace: znuny
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: znuny
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: znuny
            - name: POSTGRES_USER
              value: znuny
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: znuny-db-password
                  key: password
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
              subPath: pgdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: znuny-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: znuny
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
