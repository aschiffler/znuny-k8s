openapi: 3.0.3
info:
  title: StampIt! API
  description: |
    REST API for the StampIt! service — stamps a PDF invoice with German public-sector
    accounting data (Kontierungsstempel) and embeds a HIS-FVS import record.

    **Flow**
    1. Collect accounting metadata from the user.
    2. POST the metadata (JSON string) and the original PDF as `multipart/form-data`.
    3. Receive a stamped PDF in return.  The PDF contains:
       - The original document pages.
       - An appended stamp page filled with the accounting data.
       - An embedded attachment `E0805250.DAT` (HIS-FVS Release 2025.06 fixed-width record).

    **URL pre-fill (optional)**
    The web frontend accepts query parameters to pre-populate the form.
    Long-form and short-form parameter names are both accepted:

    | Field          | Long          | Short |
    |----------------|---------------|-------|
    | kapitel        | `kapitel`     | `k`   |
    | titel          | `titel`       | `t`   |
    | festlegung     | `festlegung`  | `f`   |
    | projekt        | `projekt`     | `p`   |
    | ausgabeart     | `ausgabeart`  | `aa`  |
    | kostenstelle   | `kostenstelle`| `ks`  |
    | kostenart      | `kostenart`   | `ka`  |
    | anwendung      | `anwendung`   | `aw`  |
    | haushaltsjahr  | `haushaltsjahr`| `h`  |
    | inventarisierung | `inventarisierung` | `i` |
    | betrag         | `betrag`      | `b`   |
    | bemerkung      | `bemerkung`   | `bm`  |
    | nutzer         | `nutzer`      | `n`   |
    | klassifikation | `klassifikation` | `kl` |
    | raum           | `raum`        | `r`   |
    | hauptgeraet    | `hauptgeraet` | `hg`  |
    | zahlungspartner| `zahlungspartner` | `z` |

  version: "1.0.0"
  contact:
    name: plan.bee GmbH

servers:
  - url: http://localhost:5000
    description: Local development server

paths:
  /stampit:
    post:
      summary: Stamp a PDF with accounting data
      description: |
        Accepts a PDF file and accounting metadata, fills the stamp form, merges it
        with the uploaded PDF, embeds a HIS-FVS DAT attachment, and returns the
        resulting PDF as a download.

        The request must be sent as `multipart/form-data` with exactly two parts:
        - **`metadata`** — a JSON-encoded string with the accounting fields (see schema).
        - **`file`** — the original PDF binary.
      operationId: stampPDF
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
                - file
              properties:
                metadata:
                  type: string
                  format: json
                  description: |
                    JSON-encoded accounting metadata. Must be a valid JSON object
                    matching the `StampMetadata` schema.
                  example: |
                    {
                      "kapitel": "05250",
                      "titel": "68530",
                      "festlegung": "1234567",
                      "projekt": "FBxxx",
                      "ausgabeart": "A1",
                      "kostenstelle": "12345",
                      "kostenart": "421000",
                      "anwendung": "01",
                      "haushaltsjahr": "2025",
                      "inventarisierung": "false",
                      "bemerkung": "Rechnung XY vom 01.01.2025",
                      "betrag": "1234,56",
                      "hauptgeraet": "",
                      "nutzer": "",
                      "raum": "",
                      "klassifikation": ""
                    }
                file:
                  type: string
                  format: binary
                  description: The original PDF file to be stamped (max 10 MB).
            encoding:
              metadata:
                contentType: application/json
              file:
                contentType: application/pdf
      responses:
        "200":
          description: |
            Stamped PDF returned as a binary download.
            The PDF contains:
            - All pages of the original uploaded document.
            - An appended stamp page with the filled accounting form (fields locked).
            - An embedded file attachment `E0805250.DAT` containing the HIS-FVS
              fixed-width import record (Release 2025.06).
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename=filled_stamp.pdf
            Content-Type:
              schema:
                type: string
                example: application/pdf
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request — malformed multipart form, missing parts, or invalid JSON in `metadata`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                parseForm:
                  summary: Could not parse multipart form
                  value: { "error": "Error parsing form" }
                parseJson:
                  summary: Invalid JSON in metadata field
                  value: { "error": "Error parsing JSON data" }
                missingFile:
                  summary: No file part in the request
                  value: { "error": "Error retrieving file" }
        "500":
          description: Internal server error during PDF processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                fillForm:
                  value: { "error": "Error filling form" }
                mergePDF:
                  value: { "error": "Finally give up merging PDF files" }
                attachFile:
                  value: { "error": "Error attaching file to PDF" }

components:
  schemas:

    StampMetadata:
      type: object
      description: |
        Accounting metadata placed on the stamp page and encoded into the
        HIS-FVS DAT attachment.  All fields are strings; the backend applies
        formatting (e.g. currency) before writing to the PDF.
      properties:
        kapitel:
          type: string
          description: Budget chapter number (Kapitel). Maps to HIS-FVS field `kapitel` (5 chars ALPHA).
          example: "05250"
        titel:
          type: string
          description: Budget title number (Titel). Maps to HIS-FVS field `titel` (5 chars ALPHA).
          example: "68530"
        festlegung:
          type: string
          description: |
            Commitment / hull number (Festlegung / Hüllnummer).
            Maps to HIS-FVS field `huel_nr` (7 chars NUM).
          example: "1234567"
        projekt:
          type: string
          description: |
            Department / project identifier (FB/Projekt).
            Maps to HIS-FVS field `kto_ebene_1` (10 chars ALPHA).
          example: "FBxxx"
        ausgabeart:
          type: string
          description: |
            Expenditure type / INS/A-Art.
            Maps to HIS-FVS field `kto_ebene_2` (10 chars ALPHA).
          example: "A1"
        kostenstelle:
          type: string
          description: |
            Cost center / cost carrier (KST/KTR).
            Maps to HIS-FVS field `kostenstelle` (10 chars ALPHA).
          example: "12345"
        kostenart:
          type: string
          description: |
            Cost type (KOA / Kostenart).
            Maps to HIS-FVS field `kostenart` (12 chars ALPHA).
          example: "421000"
        anwendung:
          type: string
          description: Application code (AW / Anwendung). Stamp display only.
          example: "01"
        haushaltsjahr:
          type: string
          description: |
            Fiscal year (Haushaltsjahr), 4-digit string.
            Maps to HIS-FVS field `haushaltsjahr` (4 chars ALPHA).
          example: "2025"
        inventarisierung:
          type: string
          enum:
            - "true"
            - "false"
          description: |
            Whether the purchase requires inventory registration.
            `"true"` → stamp radio button set to "ja".
            `"false"` → stamp radio button set to "nein".
            When `"false"`, the fields `hauptgeraet`, `nutzer`, `raum`, and
            `klassifikation` are ignored.
          example: "false"
        bemerkung:
          type: string
          description: Free-text purpose / note (Verwendungszweck / Bemerkung). Stamp display only.
          example: "Rechnung XY vom 01.01.2025"
        betrag:
          type: string
          description: |
            Amount in German decimal notation: use a comma `,` as the decimal
            separator; do **not** use a dot for thousands.
            The backend formats the value to `1.234,56` on the stamp and passes
            the raw value to HIS-FVS field `buchungsbetrag` (12 chars NUM 10,2).
          example: "1234,56"
        hauptgeraet:
          type: string
          description: |
            Main device identifier (Hauptgerät).
            Only relevant when `inventarisierung` is `"true"`. Stamp display only.
          example: "PC-001"
        nutzer:
          type: string
          description: |
            User / person responsible for the device (Nutzer).
            Only relevant when `inventarisierung` is `"true"`. Stamp display only.
          example: "Max Mustermann"
        raum:
          type: string
          description: |
            Room number (Raum).
            Only relevant when `inventarisierung` is `"true"`. Stamp display only.
          example: "A.1.01"
        klassifikation:
          type: string
          description: |
            Asset classification (Klassifikation).
            Only relevant when `inventarisierung` is `"true"`. Stamp display only.
          example: "EDV"

    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        details:
          type: string
          description: Optional additional error detail (only present for certain errors).
